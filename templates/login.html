{% extends "base.html" %}
{% block title %}Login - SpamGuard AI{% endblock %}
{% block page %}login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="sg-card p-4">
      <h2 class="h4 fw-bold mb-1">Welcome back</h2>
      <p class="text-muted">Log in to view your detection history.</p>
      <div id="formAlert"></div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
      <p class="small text-center mt-3 mb-0">No account? <a href="{{ url_for('register_page') }}">Register</a></p>
    </div>
  </div>
</div>
{% endblock %}
